<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | StruxLab</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .not-found-wrap {
            text-align: center;
            padding: 80px 0;
        }
        .not-found-code {
            font-family: var(--font-heading);
            font-size: 7rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 16px;
        }
        .not-found-wrap h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
        .not-found-wrap p {
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto 32px;
        }
    </style>
</head>
<body>

    <div id="site-navbar"></div>

    <header class="page-header">
        <div class="page-header-inner">
            <span class="section-label">Error</span>
            <h1>Page not found</h1>
        </div>
    </header>

    <section class="container">
        <div class="not-found-wrap">
            <div class="not-found-code">404</div>
            <h2>This page doesn't exist.</h2>
            <p>The link may be broken, or the page may have been moved. Head back to the homepage to find what you're looking for.</p>
            <a href="index.html" class="btn btn-primary">Go to homepage</a>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="components.js" data-depth="0"></script>
    <script>
        renderNavbar('');
        renderFooter();
    </script>

</body>
</html>
